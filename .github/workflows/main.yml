name: reFlutter x86_64 On-Demand Builder

on:
  workflow_dispatch:
    inputs:
      snapshot_hash:
        description: 'Yama Yapılacak Uygulamanın SNAPSHOT_HASH Değeri (Örn: cat SNAPSHOT_HASH)'
        required: true
        default: '97ff04a728735e6b6b098bdf983faaba'

jobs:
  build-v2-x64:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set variables
        run: |
          echo "SNAPSHOT_HASH=${{ github.event.inputs.snapshot_hash }}" >> $GITHUB_ENV

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build python3-pip python3-setuptools
          python3 -m pip install wheel --break-system-packages || python3 -m pip install wheel
          python3 -m pip install . --break-system-packages || python3 -m pip install .
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
          git clone https://github.com/flutter/flutter.git engine

      - name: gclient sync
        run: |
          ROOT_DIR=`pwd`
          export PATH=$PATH:$ROOT_DIR/depot_tools
          cd engine
          git config --global user.email "rereflutter@example.com" && git config --global user.name "rereflutter"
          git fetch origin $(reflutter -b ${{env.SNAPSHOT_HASH}})
          git reset --hard FETCH_HEAD
          reflutter -b ${{env.SNAPSHOT_HASH}}
          echo 'reflutter' > REFLUTTER
          git add . && git commit -am "reflutter"
          cd $ROOT_DIR
          mkdir customEngine
          cd customEngine
          echo 'solutions = [{"managed": False,"name": ".","url": "'$ROOT_DIR/engine'","custom_deps": {},"deps_file": "DEPS","safesync_url": "",},]' > .gclient
          gclient sync
          reflutter -b ${{env.SNAPSHOT_HASH}}

      - name: ninja build libflutter_x86_64 (v2)
        run: |
          export PATH=$PATH:`pwd`/depot_tools
          customEngine/engine/src/flutter/tools/gn --no-goma --android --android-cpu=x64 --runtime-mode=release
          ninja -C customEngine/engine/src/out/android_release_x64

      - name: Move to release
        run: |
          mkdir -p output_v2
          cp customEngine/engine/src/out/android_release_x64/lib.stripped/libflutter.so output_v2/libflutter_x86_64_v2.so 2>/dev/null || :

      - name: Upload Artifact V2
        uses: actions/upload-artifact@v4
        with:
          name: reflutter-libflutter-x86_64-v2
          path: output_v2/

  build-v3-x64:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set variables
        run: |
          echo "SNAPSHOT_HASH=${{ github.event.inputs.snapshot_hash }}" >> $GITHUB_ENV

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build python3-pip python3-setuptools
          python3 -m pip install wheel --break-system-packages || python3 -m pip install wheel
          python3 -m pip install . --break-system-packages || python3 -m pip install .
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
          git clone https://github.com/flutter/flutter.git engine

      - name: gclient sync
        run: |
          ROOT_DIR=`pwd`
          export PATH=$PATH:$ROOT_DIR/depot_tools
          cd engine
          git config --global user.email "rereflutter@example.com" && git config --global user.name "rereflutter"
          git fetch origin $(reflutter -b ${{env.SNAPSHOT_HASH}})
          git reset --hard FETCH_HEAD
          reflutter -b ${{env.SNAPSHOT_HASH}} -p
          echo 'reflutter' > REFLUTTER
          git add . && git commit -am "reflutter"
          cd $ROOT_DIR
          mkdir customEngine
          cd customEngine
          echo 'solutions = [{"managed": False,"name": ".","url": "'$ROOT_DIR/engine'","custom_deps": {},"deps_file": "DEPS","safesync_url": "",},]' > .gclient
          gclient sync
          reflutter -b ${{env.SNAPSHOT_HASH}} -p

      - name: ninja build libflutter_x86_64 (v3)
        run: |
          export PATH=$PATH:`pwd`/depot_tools
          customEngine/engine/src/flutter/tools/gn --no-goma --android --android-cpu=x64 --runtime-mode=release
          ninja -C customEngine/engine/src/out/android_release_x64

      - name: Move to release
        run: |
          mkdir -p output_v3
          cp customEngine/engine/src/out/android_release_x64/lib.stripped/libflutter.so output_v3/libflutter_x86_64_v3.so 2>/dev/null || :

      - name: Upload Artifact V2/V3
        uses: actions/upload-artifact@v4
        with:
          name: reflutter-libflutter-x86_64-v3
          path: output_v3/
